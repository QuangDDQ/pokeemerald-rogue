name: CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm

    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      MODERN: 0
      COMPARE: 0
      AUTOMATION_HOST: GITHUB

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout agbcc
        uses: actions/checkout@v4
        with:
          path: agbcc
          repository: pret/agbcc

      - name: Install binutils
        run: |
          sudo apt update
          sudo apt install -y build-essential libpng-dev libelf-dev

      - name: Install Dependencies
        run: |
          ./init_deps.sh

      - name: Install agbcc
        working-directory: agbcc
        run: |
          ./build.sh
          ./install.sh ../

      - name: Build Debug
        env:
          RELEASE: 0
        run: make -j$(nproc) -O all

      - name: Build Release
        env:
          RELEASE: 1
        run: make -j$(nproc) -O all

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: pokeemerald-rom
          path: |
            pokeemerald.gba
            pokeemerald.elf

      - name: Update Memory Stats
        uses: actions/upload-artifact@v4
        with:
          name: Memory Stats
          path: pokeemerald_memorystats.csv
